plugins {
    id 'java'
    id 'io.papermc.paperweight.userdev' version '2.0.0-SNAPSHOT'
}

group = 'net.lumalyte'
version = '1.0.1-26.2-test.1'

repositories {
    mavenCentral()
    maven {
        name = 'papermc-repo'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        name = 'sonatype'
        url = 'https://oss.sonatype.org/content/groups/public/'
    }
}

dependencies {
    // Paper with NMS mappings using paperweight
    // Update this version to match your server version
    paperweight.paperDevBundle('26.2.build.129-stable')

    compileOnly 'org.jetbrains:annotations:20.1.0'
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

jar {
    archiveBaseName.set('EnthusiaBiomes')
    archiveVersion.set(version)

    manifest {
        attributes(
            'Implementation-Title': 'EnthusiaBiomes',
            'Implementation-Version': version
        )
    }
}

// Paper 26.2 uses Mojang mappings at runtime. Deploy the plain JAR;
// legacy reobfuscation embeds versioned CraftBukkit classes that no longer exist.
